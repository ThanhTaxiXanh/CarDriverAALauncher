name: ONE TIME - Generate permanent keystore
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create YOUR ONLY permanent release key
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASS" && test -n "$KEY_PASS" && test -n "$ALIAS"
          umask 077
          keytool -genkeypair -v -storetype PKCS12 -keystore "$RUNNER_TEMP/release.jks" \
            -alias "$ALIAS" -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=CarDriverLauncher, OU=Mobile, O=Private, L=Hanoi, C=VN" \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS"
          # GitHub artifact is PRIVATE/CRITICAL: remove it after setting the secret.
          base64 -w0 "$RUNNER_TEMP/release.jks" > "$RUNNER_TEMP/RELEASE_KEYSTORE_BASE64.txt"
          sha256sum "$RUNNER_TEMP/release.jks" > "$RUNNER_TEMP/release.jks.sha256"
          keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -alias "$ALIAS" \
            -storepass "$STORE_PASS" | grep -E 'SHA256:|Alias name:' > "$RUNNER_TEMP/certificate-info.txt"
      - name: Download these files once, then DELETE workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PRIVATE-ONE-TIME-KEYSTORE-BACKUP
          path: |
            ${{ runner.temp }}/release.jks
            ${{ runner.temp }}/RELEASE_KEYSTORE_BASE64.txt
            ${{ runner.temp }}/release.jks.sha256
            ${{ runner.temp }}/certificate-info.txt
          retention-days: 1
