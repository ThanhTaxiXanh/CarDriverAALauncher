name: Build signed CarDriverLauncher APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 37 and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"
      # We ship a shell bootstrap gradlew so users can build entirely from GitHub.
      # setup-gradle provides the pinned executable. You can later generate and commit
      # an official wrapper JAR with: gradle wrapper --gradle-version 9.6.0
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Check required secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASS" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASS" || { echo "Missing KEY_PASSWORD"; exit 1; }
      - name: Restore permanent release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/secure"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/secure/release.jks"
          test -s "$RUNNER_TEMP/secure/release.jks"
      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/secure/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
          BUILD_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease --stacktrace --no-daemon
      - name: Verify APK signature
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" "$RUNNER_TEMP/CarDriverLauncher-release.apk"
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarDriverLauncher-release-${{ github.run_number }}
          path: ${{ runner.temp }}/CarDriverLauncher-release.apk
          if-no-files-found: error
          retention-days: 30
